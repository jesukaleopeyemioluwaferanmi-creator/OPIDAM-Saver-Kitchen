<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPIDAM Saver Kitchen</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff8f0;color:#25170e}header{background:#f47b20;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-weight:800;font-size:22px}.cartbtn,.add{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.cartbtn{color:#f47b20;background:#fff}.hero{text-align:center;padding:55px 5%;background:#ffe5ca}.hero h1{font-size:40px;margin:5px}.hero p{color:#765f50}.hero a{display:inline-block;background:#f47b20;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700}section{max-width:1150px;margin:auto;padding:30px 5%}h2{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0001}.card img{width:100%;height:155px;object-fit:cover}.body{padding:15px}.price{color:#f47b20;font-weight:800;margin:8px 0 12px}.add{background:#f47b20;color:#fff}.filter{text-align:center;margin-bottom:20px}.filter button{border:1px solid #f47b20;background:#fff;color:#f47b20;border-radius:20px;padding:8px 13px;margin:3px}.filter .active{background:#f47b20;color:#fff}.cart{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px #0001}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.qty button{border:0;background:#ffe1c7;padding:5px 9px;border-radius:6px}input,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.total{text-align:right;font-size:22px;font-weight:800;margin:16px 0}footer{text-align:center;background:#25170e;color:#fff;padding:25px}
</style></head><body>
<header><div class="logo">🍊 OPIDAM Saver Kitchen</div><button class="cartbtn" onclick="document.getElementById('cart').scrollIntoView()">🛒 Cart (<span id="count">0</span>)</button></header>
<div class="hero"><h1>Delicious Food. Saver Price.</h1><p>Fresh Nigerian meals in Oyo & Ibadan.</p><a href="#menu">View Menu</a></div>
<section><h2>🔥 Popular Meals</h2><div class="grid" id="popular"></div></section>
<section id="menu"><h2>🍽️ Our Menu</h2><div class="filter">
<button class="active" onclick="show('all',this)">All</button><button onclick="show('rice',this)">Rice & Pasta</button><button onclick="show('beans',this)">Beans & Yam</button><button onclick="show('swallow',this)">Swallow</button><button onclick="show('other',this)">Others</button></div><div class="grid" id="menuGrid"></div></section>
<section id="cart"><h2>🛒 Your Order</h2><div class="cart"><div id="items">Your cart is empty.</div><div class="total">Total: ₦<span id="total">0</span></div><input id="name" placeholder="Your name"><input id="phone" placeholder="Phone number"><textarea id="address" rows="3" placeholder="Delivery address"></textarea><button class="add" style="width:100%" onclick="checkout()">Order on WhatsApp</button></div></section>
<footer>OPIDAM Saver Kitchen • Oyo & Ibadan<br>08143521348 • 0708 521 1295</footer>
<script>
const R="https://images.pexels.com/photos/17952748/pexels-photo-of-fried-cubes-and-rice-on-white-plate.jpeg?auto=compress&dpr=1&h=750&w=1260",B="https://images.pexels.com/photos/4020158/pexels-photo-4020158.jpeg?auto=compress&dpr=1&h=750&w=1260",N="https://images.pexels.com/photos/15274935/pexels-photo-of-meal-with-fried-egg-and-noodles.jpeg?auto=compress&dpr=1&h=750&w=1260";
const M=[["Jollof Rice + Beef + Plantain",3000,"rice",R],["Native / Concoction Rice + Beef",3000,"rice",R],["White Rice & Beans + Stew + Beef",2800,"rice",R],["White Rice & Stew + Egg",2000,"rice",R],["White Rice & Stew + Beef",2700,"rice",R],["White Rice & Stew + Fish",3500,"rice",R],["Native Spaghetti + Beef",3000,"rice",N],["Spaghetti + Egg + Beef + Plantain",3200,"rice",N],["Yam & Egg Sauce",2500,"beans",B],["Plantain & Egg Sauce",2300,"beans",B],["Beans Porridge + Plantain + Ponmo",2800,"beans",B],["Beans + Dodo + Egg",2500,"beans",B],["Moi Moi",1000,"other",B],["Akara",1000,"other",B],["Amala + Efo Riro + Beef",3000,"swallow",B],["Amala + Efo Riro + Fish",3500,"swallow",B],["Semovita + Egusi + Beef",3000,"swallow",B],["Semovita + Egusi + Fish",3500,"swallow",B],["Semovita + Ogbono + Beef",3000,"swallow",B],["Semovita + Ogbono + Fish",3500,"swallow",B],["Yam Porridge + Panla",3000,"beans",B],["Noodles + 2 Eggs",2000,"other",N],["Noodles + 1 Egg",1500,"other",N],["Roasted Fried Peppered Meat",2500,"other",R]];
let cart=JSON.parse(localStorage.getItem("opidamCart")||"{}");
const money=n=>n.toLocaleString("en-NG");
function card(x){return `<div class="card"><img src="${x[3]}" loading="lazy"><div class="body"><b>${x[0]}</b><div class="price">₦${money(x[1])}</div><button class="add" onclick='add(${JSON.stringify(x[0])},${x[1]})'>Add to Cart</button></div></div>`}
function show(c,b){document.querySelectorAll(".filter button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("menuGrid").innerHTML=M.filter(x=>c=="all"||x[2]==c).map(card).join("")}
function add(n,p){cart[n]=cart[n]||{price:p,qty:0};cart[n].qty++;save();render();document.getElementById("cart").scrollIntoView({behavior:"smooth"})}
function change(n,d){cart[n].qty+=d;if(cart[n].qty<1)delete cart[n];save();render()}
function save(){localStorage.setItem("opidamCart",JSON.stringify(cart))}
function render(){let s="",t=0,c=0;for(const[n,i]of Object.entries(cart)){t+=i.price*i.qty;c+=i.qty;s+=`<div class="row"><span><b>${n}</b><br>₦${money(i.price)} × ${i.qty}</span><span class="qty"><button onclick='change(${JSON.stringify(n)},-1)'>−</button> <button onclick='change(${JSON.stringify(n)},1)'>+</button></span></div>`}document.getElementById("items").innerHTML=s||"Your cart is empty.";document.getElementById("total").textContent=money(t);document.getElementById("count").textContent=c}
function checkout(){if(!Object.keys(cart).length)return alert("Please add a meal to your cart.");let n=name.value.trim(),p=phone.value.trim(),a=address.value.trim();if(!n||!p||!a)return alert("Please fill in your name, phone and address.");let t=0,msg="Hello OPIDAM Saver Kitchen!%0A%0AOrder:%0A";for(const[x,i]of Object.entries(cart)){msg+=encodeURIComponent("• "+x+" × "+i.qty+" = ₦"+money(i.price*i.qty))+"%0A";t+=i.price*i.qty}msg+=encodeURIComponent("%0ATotal: ₦"+money(t)+"%0AName: "+n+"%0APhone: "+p+"%0AAddress: "+a);location.href="https://wa.me/2348143521348?text="+msg}
document.getElementById("popular").innerHTML=[M[0],M[11],M[21]].map(card).join("");show("all",document.querySelector(".filter button"));render();
</script></body></html>
